name: Sync Repository & Username Identity

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run once daily to catch any external username or repo rename
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect and Update Username References
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          python3 - << 'PY'
          import os
          import re
          import glob

          owner = os.environ["OWNER"]
          repo = os.environ["REPO"]
          # Historical usernames this repository has been published under.
          olds = ["rezariski", "onegamer042-sys"]

          files = ["README.md"] + glob.glob("assets/*.svg")

          def url_sub(text, pattern, repl):
              return re.sub(pattern, repl, text)

          for path in files:
              if not os.path.exists(path):
                  continue
              with open(path, "r", encoding="utf-8") as f:
                  original = f.read()
              text = original

              for old in olds:
                  if old == owner:
                      continue
                  o = re.escape(old)
                  text = url_sub(text, rf"github\.com/{o}\.png", f"github.com/{owner}.png")
                  text = url_sub(text, rf"github\.com/{o}/{o}\.github\.io", f"github.com/{owner}/{repo}.github.io")
                  text = url_sub(text, rf"github\.com/{o}/{o}(?![A-Za-z0-9_-])", f"github.com/{owner}/{repo}")
                  text = url_sub(text, rf"github\.com/{o}/(?=[A-Za-z0-9_-])", f"github.com/{owner}/")
                  text = url_sub(text, rf"github\.com/{o}(?![A-Za-z0-9_.-])", f"github.com/{owner}")
                  text = url_sub(text, rf"@{o}(?![A-Za-z0-9_-])", f"@{owner}")
                  text = url_sub(text, rf"operator㉿{o}(?![A-Za-z0-9_-])", f"operator㉿{owner}")
                  text = url_sub(text, rf"operator@{o}(?![A-Za-z0-9_-])", f"operator@{owner}")
                  text = url_sub(text, rf"\[IDENTITY\]\s*:\s*{o}(?![A-Za-z0-9_-])", f"[IDENTITY] : {owner}")
                  text = url_sub(text, rf"badge/USER-{o}(?![A-Za-z0-9_-])", f"badge/USER-{owner}")
                  text = url_sub(text, rf"badge/GitHub-{o}(?![A-Za-z0-9_-])", f"badge/GitHub-{owner}")
                  text = url_sub(text, rf"\[USER\]\s*:\s*{o}(?![A-Za-z0-9_-])", f"[USER] : {owner}")

              # Normalize account/repo specific badges and query params.
              text = url_sub(text, r"badge/REPO-[^?\"\s]*", f"badge/REPO-{owner}%2F{repo}")
              text = url_sub(text, r"(github/last-commit/)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", rf"\g<1>{owner}/{repo}")
              text = url_sub(text, r"(github/repo-size/)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", rf"\g<1>{owner}/{repo}")
              text = url_sub(text, r"([?&](?:user|username)=)[A-Za-z0-9_.-]+", rf"\g<1>{owner}")

              if text != original:
                  print(f"Updating references in {path}")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(text)
              else:
                  print(f"No changes needed in {path}")
          PY

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s) ]]; then
            git add README.md assets
            git commit -m "chore(auto): synchronize username and repository identity to ${{ github.repository_owner }}"
            git push
          else
            echo "Everything up to date."
          fi