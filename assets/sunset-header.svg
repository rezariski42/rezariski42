<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080911"/>
      <stop offset="40%" stop-color="#140E26"/>
      <stop offset="70%" stop-color="#2D1136"/>
      <stop offset="88%" stop-color="#581635"/>
      <stop offset="96%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glowing Grid Horizon -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080911" stop-opacity="0"/>
    </linearGradient>

    <!-- Sun Disc -->
    <radialGradient id="cyberSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="25%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- City / Server Node Silhouettes -->
    <linearGradient id="citySil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F0D24"/>
      <stop offset="100%" stop-color="#08030B"/>
    </linearGradient>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 950;
      letter-spacing: 7px;
      fill: #FFFFFF;
      text-shadow: 0 4px 25px rgba(0,0,0,0.9), 0 0 35px rgba(245,158,11,0.6);
    }
    .brand-sub {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      letter-spacing: 3.5px;
      font-size: 13.5px;
      fill: #FDE68A;
    }
    .hud-tag {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #FFFFFF;
    }
    .coord {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      fill: #F59E0B;
      opacity: 0.6;
    }
  </style>

  <!-- Sky Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background Lines -->
  <g opacity="0.18" stroke="#F59E0B" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
  </g>

  <!-- Technical Overlay HUD Coordinates -->
  <text x="35" y="35" class="coord">SYS::ONLINE [CACHYOS_X86_64]</text>
  <text x="1040" y="35" class="coord">SEC::LEVEL_0 // ENCRYPTED</text>
  <circle cx="20" cy="32" r="4" fill="#10B981"/>

  <!-- Sinking Sun -->
  <circle cx="600" cy="275" r="140" fill="url(#cyberSun)"/>
  <circle cx="600" cy="275" r="50" fill="#FFFBEB" opacity="0.95"/>

  <!-- Server Skyline / City Silhouette -->
  <path d="M0 420 L0 320 L35 320 L35 300 L55 300 L55 330 L95 330 L95 280 L120 280 L120 335 L170 335 L170 310 L200 310 L200 270 L225 270 L225 325 L280 325 L280 295 L310 295 L310 340 L380 340 L380 285 L420 285 L420 330 L480 330 L480 260 L505 260 L505 325 L550 325 L550 335 L650 335 L650 270 L685 270 L685 320 L740 320 L740 290 L770 290 L770 335 L830 335 L830 275 L865 275 L865 330 L915 330 L915 305 L950 305 L950 325 L1010 325 L1010 265 L1040 265 L1040 330 L1100 330 L1100 295 L1135 295 L1135 335 L1200 335 L1200 420 Z" fill="url(#citySil)"/>

  <!-- Perspective Horizon Grid Floor -->
  <g stroke="url(#gridGrad)" stroke-width="1.2" opacity="0.75">
    <line x1="600" y1="330" x2="0" y2="420"/>
    <line x1="600" y1="330" x2="150" y2="420"/>
    <line x1="600" y1="330" x2="300" y2="420"/>
    <line x1="600" y1="330" x2="450" y2="420"/>
    <line x1="600" y1="330" x2="600" y2="420"/>
    <line x1="600" y1="330" x2="750" y2="420"/>
    <line x1="600" y1="330" x2="900" y2="420"/>
    <line x1="600" y1="330" x2="1050" y2="420"/>
    <line x1="600" y1="330" x2="1200" y2="420"/>
    <!-- Horizontal Perspective Crosslines -->
    <line x1="450" y1="345" x2="750" y2="345"/>
    <line x1="320" y1="365" x2="880" y2="365"/>
    <line x1="160" y1="390" x2="1040" y2="390"/>
    <line x1="0" y1="418" x2="1200" y2="418" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Center Identity Branding -->
  <g text-anchor="middle">
    <!-- Main Name -->
    <text x="600" y="140" class="brand-title" font-size="46">REYZHA RIZKY</text>

    <!-- Spectrum Tagline -->
    <text x="600" y="176" class="brand-sub">FULL-STACK • GAME SYSTEMS • NETWORKING • OFFENSIVE SECURITY</text>

    <!-- Multi-Discipline Pill Badges -->
    <g transform="translate(145, 202)">
      <!-- Pill 1: Full-Stack -->
      <rect x="0" y="0" width="165" height="30" rx="15" fill="#0D1117" fill-opacity="0.85" stroke="#3B82F6" stroke-width="1.3"/>
      <circle cx="16" cy="15" r="4.5" fill="#3B82F6"/>
      <text x="28" y="19" class="hud-tag">LARAVEL &amp; FULLSTACK</text>

      <!-- Pill 2: Game Dev -->
      <rect x="180" y="0" width="175" height="30" rx="15" fill="#0D1117" fill-opacity="0.85" stroke="#F59E0B" stroke-width="1.3"/>
      <circle cx="196" cy="15" r="4.5" fill="#F59E0B"/>
      <text x="208" y="19" class="hud-tag">UNITY 6 • ROBLOX LUAU</text>

      <!-- Pill 3: Infrastructure -->
      <rect x="370" y="0" width="180" height="30" rx="15" fill="#0D1117" fill-opacity="0.85" stroke="#10B981" stroke-width="1.3"/>
      <circle cx="386" cy="15" r="4.5" fill="#10B981"/>
      <text x="398" y="19" class="hud-tag">MIKROTIK &amp; NETWORKS</text>

      <!-- Pill 4: Mobile & Low-Level -->
      <rect x="565" y="0" width="165" height="30" rx="15" fill="#0D1117" fill-opacity="0.85" stroke="#EC4899" stroke-width="1.3"/>
      <circle cx="581" cy="15" r="4.5" fill="#EC4899"/>
      <text x="593" y="19" class="hud-tag">ROOT • JAILBREAK</text>

      <!-- Pill 5: Bug Hunting -->
      <rect x="745" y="0" width="160" height="30" rx="15" fill="#0D1117" fill-opacity="0.85" stroke="#8B5CF6" stroke-width="1.3"/>
      <circle cx="761" cy="15" r="4.5" fill="#8B5CF6"/>
      <text x="773" y="19" class="hud-tag">BUG HUNTING &amp; SEC</text>
    </g>
  </g>
</svg>